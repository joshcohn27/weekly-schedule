<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A small schedule grid in the app's own colors: forest green, with one period picked out in the day-header peach. -->
  <rect width="64" height="64" rx="12" fill="#2f5d3a"/>
  <g fill="#fbf7ee">
    <rect x="11" y="11" width="18" height="12" rx="2"/>
    <rect x="35" y="11" width="18" height="12" rx="2"/>
    <rect x="11" y="27" width="18" height="12" rx="2"/>
    <rect x="11" y="43" width="18" height="12" rx="2"/>
    <rect x="35" y="43" width="18" height="12" rx="2"/>
  </g>
  <rect x="35" y="27" width="18" height="12" rx="2" fill="#f6b26b"/>
</svg>
